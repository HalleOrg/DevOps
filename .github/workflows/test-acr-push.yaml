# name: DevSecOps POC - Docker, Azure OIDC and ACR Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  docker-azure-test:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Build Docker image
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t devsecops-poc:test .

      # ---------------------------------------------------
      # 3. Run Docker container
      # ---------------------------------------------------
      - name: Run Docker container
        run: |
          docker run -d \
            --name devsecops-poc \
            -p 8080:8080 \
            devsecops-poc:test

      # ---------------------------------------------------
      # 4. Wait for application
      # ---------------------------------------------------
      - name: Wait for application
        run: sleep 5

      # ---------------------------------------------------
      # 5. Test application health
      # ---------------------------------------------------
      - name: Test health endpoint
        run: curl --fail http://localhost:8080/health

      # ---------------------------------------------------
      # 6. Show Docker container status
      # ---------------------------------------------------
      - name: Show Docker container status
        run: docker ps

      # ---------------------------------------------------
      # 7. Verify Azure secrets are available
      # ---------------------------------------------------
      - name: Check Azure configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "ERROR: AZURE_CLIENT_ID is not configured"; exit 1
          else
            echo "AZURE_CLIENT_ID is configured"
          fi

          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "ERROR: AZURE_TENANT_ID is not configured"; exit 1
          else
            echo "AZURE_TENANT_ID is configured"
          fi

          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "ERROR: AZURE_SUBSCRIPTION_ID is not configured"; exit 1
          else
            echo "AZURE_SUBSCRIPTION_ID is configured"
          fi

          if [ -z "$ACR_NAME" ]; then
            echo "ERROR: ACR_NAME is not configured"; exit 1
          else
            echo "ACR_NAME is configured"
          fi

      # ---------------------------------------------------
      # 8. Authenticate GitHub to Azure using OIDC
      # ---------------------------------------------------
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------
      # 9. Verify Azure authentication
      # ---------------------------------------------------
      - name: Verify Azure login
        run: |
          echo "Azure OIDC authentication successful"
          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

      # ---------------------------------------------------
      # 10. Login to Azure Container Registry
      # ---------------------------------------------------
      - name: Login to ACR
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      # ---------------------------------------------------
      # 11. Get ACR login server
      # ---------------------------------------------------
      - name: Get ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "${{ secrets.ACR_NAME }}" \
            --query loginServer \
            --output tsv)

          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "ACR login server retrieved successfully"

      # ---------------------------------------------------
      # 12. Generate immutable image tag from Git SHA
      # ---------------------------------------------------
      - name: Generate image tag
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Docker image tag: $IMAGE_TAG"

      # ---------------------------------------------------
      # 13. Tag Docker image for ACR
      # ---------------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            devsecops-poc:test \
            "${{ steps.acr.outputs.login_server }}/devsecops-poc/sample-app:${IMAGE_TAG}"

      # ---------------------------------------------------
      # 14. Push Docker image to ACR
      # ---------------------------------------------------
      - name: Push Docker image to ACR
        run: |
          docker push \
            "${{ steps.acr.outputs.login_server }}/devsecops-poc/sample-app:${IMAGE_TAG}"

      # ---------------------------------------------------
      # 15. Verify repository and tags in ACR
      # ---------------------------------------------------
      - name: Verify image in ACR
        run: |
          echo "Available tags in ACR:"
          az acr repository show-tags \
            --name "${{ secrets.ACR_NAME }}" \
            --repository devsecops-poc/sample-app \
            --output table

      # ---------------------------------------------------
      # 16. Capture immutable image digest
      # ---------------------------------------------------
      - name: Capture image digest
        run: |
          DIGEST=$(az acr repository show \
            --name "${{ secrets.ACR_NAME }}" \
            --image "devsecops-poc/sample-app:${IMAGE_TAG}" \
            --query digest \
            --output tsv)

          echo "=============================================="
          echo "Image successfully pushed to ACR"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "Image Digest: ${DIGEST}"
          echo "=============================================="

          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # ---------------------------------------------------
      # 17. Final summary
      # ---------------------------------------------------
      - name: Deployment artifact summary
        run: |
          echo "Repository : devsecops-poc/sample-app"
          echo "Tag        : ${IMAGE_TAG}"
          echo "Digest     : ${IMAGE_DIGEST}"
          echo "Commit SHA : ${GITHUB_SHA}"

      # ---------------------------------------------------
      # 18. Show application logs
      # ---------------------------------------------------
      - name: Show application logs
        if: always()
        run: docker logs devsecops-poc || true

      # ---------------------------------------------------
      # 19. Logout from Azure
      # ---------------------------------------------------
      - name: Azure logout
        if: always()
        run: az logout || true
